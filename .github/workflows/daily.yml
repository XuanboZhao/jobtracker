name: daily-job-scan

on:
  schedule:
    - cron: "0 6 * * *"      # 06:00 UTC = 08:00 NL (CEST). Adjust as needed.
  workflow_dispatch: {}        # lets you run it on demand from the Actions tab

permissions:
  contents: write              # needed to commit jobs.db + data.json back

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Run pipeline
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          MAIL_TO:   ${{ secrets.MAIL_TO }}
        run: python -m jobtracker.pipeline

      - name: Commit refreshed data
        run: |
          git config user.name  "job-desk-bot"
          git config user.email "actions@github.com"
          git add jobs.db docs/data.json
          git commit -m "data: daily refresh $(date -u +%F)" || echo "no changes"
          git pull --rebase origin main
          git push
